<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="16" fill="#f5f8f0"/><g font-family="Arial,sans-serif" fill="#18372f"><text x="50" y="60" font-size="28">A small data footprint, by design.</text><g fill="white" stroke="#b4c6aa"><rect x="50" y="110" width="260" height="170" rx="12"/><rect x="460" y="110" width="280" height="170" rx="12"/><rect x="890" y="110" width="260" height="170" rx="12"/><rect x="460" y="350" width="280" height="110" rx="12"/></g><g font-size="22" font-weight="bold"><text x="80" y="150">Browser</text><text x="490" y="150">Next.js on Vercel</text><text x="920" y="150">Report</text><text x="490" y="390">Neon Postgres</text></g><g font-size="17"><text x="80" y="190">PDF + chosen bank</text><text x="80" y="220">3 MB / 30-page limit</text><text x="490" y="190">pdf-parse → bank adapter</text><text x="490" y="220">Rules → integer totals</text><text x="490" y="250">No file persistence</text><text x="920" y="190">Categories + candidates</text><text x="920" y="220">Explicit tie-out state</text><text x="920" y="250">Tab memory only</text><text x="490" y="420">Interest emails, rate limits,</text><text x="490" y="444">aggregate counters only</text></g><g stroke="#40663b" stroke-width="2" fill="none"><path d="M310 195H450m-10-7 10 7-10 7"/><path d="M740 195H880m-10-7 10 7-10 7"/><path d="M600 280V340m-7-10 7 10 7-10"/></g><text x="330" y="177" font-size="14">HTTPS</text><text x="770" y="177" font-size="14">Sanitised JSON</text><text x="630" y="320" font-size="14">Server-only, scoped role</text></g></svg>
